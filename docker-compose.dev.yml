services:
  db:
    image: pgvector/pgvector:pg18
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      POSTGRES_USER: pdl_user
      POSTGRES_DB: pdl_db
      PGDATA: /var/lib/postgresql/18/data
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdl_user -d pdl_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "3900:9000" # S3 API
      - "3901:9001" # Web UI Console
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          mode: 0777
    command: ["/data"]
    restart: unless-stopped

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      - BUCKET_NAME=pdl-images
    restart: "on-failure:3"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        echo "Waiting for RustFS to start..."
        until mc alias set localrustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /dev/null 2>&1; do
          sleep 2
        done
        echo "Creating bucket $${BUCKET_NAME}..."
        mc mb localrustfs/$${BUCKET_NAME} || true
        echo "RustFS Initialized successfully."

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      - HOST_NAME=db
      - DATABASE_NAME=pdl_db
      - DATABASE_USER=pdl_user
      - APP_UNSPLASH_DATASET_DIR=/var/lib/pdl/datasets
      - APP_MODELS_DIR=/var/lib/pdl/models
      - S3_ENDPOINT=http://rustfs:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=pdl-images
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=WARN
    volumes:
      - datasets:/var/lib/pdl/datasets
      - ./backend/models:/var/lib/pdl/models
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--log.level=warn"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:12.4.2
    environment:
      - GF_LOG_LEVEL=warn
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datasets:
