services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: pdl_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pdl_db
      PGDATA: /var/lib/postgresql/18/data
    expose:
      - "5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdl_user -d pdl_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rustfs:
    image: rustfs/rustfs:latest
    user: "0:0"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
    expose:
      - "9000"
      - "9001"
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          mode: "0777"
    command: ["/data"]
    restart: unless-stopped
    logging: *default-logging

  rustfs-init:
    image: minio/mc:latest
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      rustfs:
        condition: service_started
    environment:
      - BUCKET_NAME=pdl-images
    restart: "on-failure:3"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        echo "Waiting for RustFS to start..."
        until mc alias set localrustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" > /dev/null 2>&1; do
          sleep 2
        done
        echo "Creating bucket $${BUCKET_NAME}..."
        mc mb localrustfs/$${BUCKET_NAME} || true
        echo "RustFS Initialized successfully."

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      - HOST_NAME=db
      - DATABASE_NAME=pdl_db
      - DATABASE_USER=pdl_user
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - APP_UNSPLASH_DATASET_DIR=/var/lib/pdl/datasets
      - APP_MODELS_DIR=/var/lib/pdl/models
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - S3_ENDPOINT=http://rustfs:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=pdl-images
      - JWT_SECRET=${JWT_SECRET}
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=WARN
    expose:
      - "8080"
    tmpfs:
      - /var/lib/pdl/datasets
      - /var/lib/pdl/models
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
